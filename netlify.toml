[build]
  publish = "public"
  command = "npm install --omit=dev"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  publish = "public"
  port = 8888
  autoLaunch = false
